name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true

      - name: Install development dependencies
        run: uv sync --locked --extra test

      - name: Check lockfile
        run: uv lock --check

      - name: Lint Python
        run: uv run ruff check .

      - name: Lint TOML
        run: uvx --from tombi==1.1.0 tombi lint --error-on-warnings .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_POSTGRES_E2E: "1"
      E2E_POSTGRES_DB_ACME: isolated_tenants_acme
      E2E_POSTGRES_DB_GLOBEX: isolated_tenants_globex
      E2E_POSTGRES_USER: postgres
      E2E_POSTGRES_PASSWORD: postgres
      E2E_POSTGRES_HOST: 127.0.0.1
      E2E_POSTGRES_PORT: "5432"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install package and test dependencies
        run: uv sync --locked --extra test

      - name: Create disposable tenant databases
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres isolated_tenants_acme
          createdb -h 127.0.0.1 -U postgres isolated_tenants_globex

      - name: Run Django system checks
        run: uv run python -m django check --settings tests.settings

      - name: Run Django package tests
        run: uv run pytest

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"

      - name: Build wheel and source distribution
        run: uv build
